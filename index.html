<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يوم في حياة قسم إدارة المرافق</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Cairo',sans-serif;
  background:#0a0f1e;
  color:white;
  padding:20px;
  text-align:center;
}
button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.screen{display:none}
.active{display:block}
.lb-empty{color:#aaa}
</style>
</head>

<body>

<h1>🔧 يوم في حياة قسم إدارة المرافق</h1>
<p>كم كارثة راح تسوّيها اليوم؟ 😂</p>

<div id="sName" class="screen active">
<input id="nameInput" placeholder="اكتب اسمك">
<button onclick="startGame()">ابدأ</button>
</div>

<div id="sGame" class="screen">
<h2 id="question"></h2>
<div id="choices"></div>
<p id="feedback"></p>
</div>

<div id="sEnd" class="screen">
<h2 id="endTitle"></h2>
<p id="endSub"></p>
<button onclick="resetGame()">إعادة</button>
</div>

<div id="lbContent"></div>

<script>

// 🔀 خلط
function shuffleArray(arr){
 for(let i=arr.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}

// 😈 خداع ذكي + 💀 بوس
let isBoss=false;

function smartOutcome(choice){

 if(isBoss){
  let r=Math.random();

  if(r<0.4) return {chaos:choice.chaos+10,type:"fix",msg:"😈 مو كافي!"};
  if(r<0.7) return {chaos:choice.chaos+20,type:"bad",msg:"💀 تأخرت!"};

  return {chaos:choice.chaos,type:"good",msg:"🔥 نجحت بصعوبة!"};
 }

 let r=Math.random();

 if(choice.type==="fix"&&r<0.2) return {chaos:0,type:"good",msg:"😏 مشت معك!"};
 if(choice.type==="good"&&r<0.15) return {chaos:5,type:"fix",msg:"👍 مو الأفضل"};
 if(choice.type==="bad"&&r<0.1) return {chaos:choice.chaos+10,type:"bad",msg:"💀 أسوأ!"};

 return choice;
}

// 🎮 السيناريوهات
const scenarios=[
{
q:"💧 المكيف يصب موية!",
c:[
{label:"أبلغ فوراً",type:"good",msg:"صح 👏",chaos:0},
{label:"أسدها بشاش",type:"fix",msg:"ترقيع 😂",chaos:15},
{label:"أمسك أسلاك مبلولة",type:"bad",msg:"كارثة 💀",chaos:35}
]
},
{
q:"⚡ فيش يشرر!",
c:[
{label:"أفصل القاطع",type:"good",msg:"بطل 🔥",chaos:0},
{label:"أوجه مروحة",type:"fix",msg:"😂 غريب",chaos:15},
{label:"ملعقة حديد",type:"bad",msg:"💀 انتهيت",chaos:35}
]
},

/* ⭐⭐⭐ تمت إضافة السيناريوهات الجديدة هنا ⭐⭐⭐ */

{
q:"🚽 انسداد مفاجئ في دورات المياه!",
c:[
{label:"أغلق المنطقة وأبلغ السباكة",type:"good",msg:"تصرف ممتاز 👌",chaos:0},
{label:"أحاول أفك السدد بنفسي",type:"fix",msg:"محاولة شجاعة 😂",chaos:15},
{label:"أحط معطر وأمشي",type:"bad",msg:"الوضع صار أسوأ 💀",chaos:30}
]
},

{
q:"🔥 مكيف يصدر صوت طقطقة وحرارته مرتفعة!",
c:[
{label:"أفصل المكيف فوراً",type:"good",msg:"ذكي 👏",chaos:0},
{label:"أحط مروحة قدامه",type:"fix",msg:"ترقيع كلاسيكي 😂",chaos:10},
{label:"أطنش وأقول يمكن يبرد",type:"bad",msg:"انفجار محتمل 💀",chaos:35}
]
},

{
q:"📦 موظف يطلب نقل 20 كرتون ثقيلة للدور الرابع بدون مصعد!",
c:[
{label:"أطلب عمال نقل متخصصين",type:"good",msg:"تنظيم ممتاز 👌",chaos:0},
{label:"أحاول أشيلها بنفسي",type:"fix",msg:"ظهرك بيودعك 😂",chaos:10},
{label:"أقوله استخدم الدرج",type:"bad",msg:"شكوى رسمية جاية 💀",chaos:25}
]
},

{
q:"🧯 إنذار حريق اشتغل بالغلط أثناء زيارة المدير العام!",
c:[
{label:"أوقف الإنذار وأشرح الموقف",type:"good",msg:"احترافية 👏",chaos:0},
{label:"أقول يمكن تدريب مفاجئ",type:"fix",msg:"كذبة بيضاء 😂",chaos:10},
{label:"أتجاهل الإنذار",type:"bad",msg:"إحراج تاريخي 💀",chaos:30}
]
},

{
q:"🚪 باب طوارئ عالق وما يفتح!",
c:[
{label:"أبلغ الأمن والصيانة فوراً",type:"good",msg:"تصرف سريع 👏",chaos:0},
{label:"أحاول أفتحه برجلي",type:"fix",msg:"محاولة عنيفة 😂",chaos:15},
{label:"أطنش لأنه نادر الاستخدام",type:"bad",msg:"مخالفة خطيرة 💀",chaos:40}
]
},

{
q:"💡 نصف الدور مطفي بسبب خلل كهربائي!",
c:[
{label:"أفصل القاطع الرئيسي وأعيد تشغيله",type:"good",msg:"حل ممتاز 👌",chaos:0},
{label:"أجيب توصيلة وأسحب كهرباء من مكتب ثاني",type:"fix",msg:"ترقيع محترف 😂",chaos:20},
{label:"أقول للموظفين افتحوا الشبابيك",type:"bad",msg:"حل بدائي 💀",chaos:25}
]
},

/* ⭐⭐⭐ نهاية الإضافات ⭐⭐⭐ */

];

// 💀 BOSS
scenarios.push({
boss:true,
q:"💀 FINAL BOSS\nانقطاع كهرباء + ماء + إنذار!",
c:[
{label:"إخلاء + تبليغ",type:"good",msg:"قريب للصحيح",chaos:5},
{label:"إيقاف الماء",type:"fix",msg:"جزئي",chaos:15},
{label:"تهدئة فقط",type:"bad",msg:"خطأ",chaos:30}
]
});

let step=0,chaos=0,name="";
let leaderboard=JSON.parse(localStorage.getItem("lb")||"[]");

function startGame(){
 name=document.getElementById("nameInput").value;
 if(!name)return alert("اكتب اسمك");

 shuffleArray(scenarios);

 show("sGame");
 load();
}

function load(){
 let s=scenarios[step];
 isBoss=!!s.boss;

 let q=document.getElementById("question");
 q.innerText=s.q;
 if(isBoss) q.style.color="red";

 let box=document.getElementById("choices");
 box.innerHTML="";

 shuffleArray([...s.c]).forEach(c=>{
  let b=document.createElement("button");
  b.innerText=c.label;
  b.onclick=()=>pick(c);
  box.appendChild(b);
 });
}

function pick(choice){

 let result=smartOutcome(choice);
 let rand=Math.floor(Math.random()*6);

 chaos+=result.chaos+rand;

 document.getElementById("feedback").innerText=result.msg;

 setTimeout(()=>{
  step++;
  if(step>=scenarios.length) end();
  else load();
 },1500);
}

function end(){
 document.getElementById("endTitle").innerText="انتهت اللعبة";
 document.getElementById("endSub").innerHTML=
`نسبة الكوارث: ${chaos}%<br><br>🏢 قسم إدارة المرافق`;

 leaderboard.push({name,chaos});
 leaderboard.sort((a,b)=>a.chaos-b.chaos);
 localStorage.setItem("lb",JSON.stringify(leaderboard));

 renderLB();
 show("sEnd");
}

function renderLB(){
 let el=document.getElementById("lbContent");

 if(!leaderboard.length){
  el.innerHTML='<div class="lb-empty">للان المستشفى سليمة 🏥✨</div>';
  return;
 }

 el.innerHTML=leaderboard.map(e=>`<div>${e.name} - ${e.chaos}%</div>`).join("");
}

function resetGame(){
 step=0;chaos=0;
 show("sName");
}

function show(id){
 ["sName","sGame","sEnd"].forEach(s=>document.getElementById(s).classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

renderLB();

</script>

</body>
</html>
