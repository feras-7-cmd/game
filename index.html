<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يوم في حياة قسم إدارة المرافق</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Cairo',sans-serif;
  background:linear-gradient(135deg,#0a0f1e,#111a33);
  color:white;
  padding:20px;
  text-align:center;
  position:relative;
  min-height:100vh;
}

h1{
  font-size:36px;
  margin-bottom:10px;
  text-shadow:0 0 10px #00c8ff;
}

.screen{
  display:none;
  animation:fade .5s ease;
}

.active{
  display:block;
}

button{
  padding:14px 20px;
  margin:8px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:#00aaff;
  color:white;
  font-size:18px;
  transition:.2s;
}

button:hover{
  background:#0088dd;
  transform:scale(1.05);
}

#choices button{
  width:80%;
  max-width:400px;
  display:block;
  margin:10px auto;
}

input{
  padding:12px;
  width:70%;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
  font-size:18px;
}

#feedback{
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
}

#lbContent{
  margin-top:20px;
  background:#0f1629;
  padding:15px;
  border-radius:10px;
  max-width:400px;
  margin-left:auto;
  margin-right:auto;
}

footer{
  position:absolute;
  bottom:10px;
  left:0;
  right:0;
  text-align:center;
  color:#ccc;
  font-size:14px;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<!-- 🌍 اختيار اللغة -->
<div style="position:absolute;top:15px;left:15px;">
  <button onclick="toggleLang()">🌐</button>
</div>

<!-- 🏠 صفحة البداية -->
<div id="sStart" class="screen active">
  <h1 id="title">🔧 يوم في حياة قسم إدارة المرافق</h1>
  <p id="subtitle">جاهز تشوف كم كارثة بتسوي اليوم؟ 😂</p>

  <input id="nameInput" placeholder="اكتب اسمك">
  <br>
  <button onclick="startGame()" id="startBtn">ابدأ اللعبة</button>
</div>

<!-- 🎮 شاشة اللعبة -->
<div id="sGame" class="screen">
  <h2 id="question"></h2>
  <div id="choices"></div>
  <p id="feedback"></p>
</div>

<!-- 🏁 شاشة النهاية -->
<div id="sEnd" class="screen">
  <h2 id="endTitle"></h2>
  <p id="endSub"></p>
  <button onclick="resetGame()" id="restartBtn">إعادة اللعب</button>
  <div id="lbContent"></div>
</div>

<footer>
قسم إدارة المرافق — برعاية أ. فراس يماني و المهندسين
</footer>

<script>

// 🌍 الترجمة
let lang="ar";

const text={
  ar:{
    title:"🔧 يوم في حياة قسم إدارة المرافق",
    subtitle:"جاهز تشوف كم كارثة بتسوي اليوم؟ 😂",
    start:"ابدأ اللعبة",
    restart:"إعادة اللعب",
    placeholder:"اكتب اسمك",
    end:"انتهت اللعبة",
    dept:"🏢 قسم إدارة المرافق"
  },
  en:{
    title:"🔧 A Day in Facility Management",
    subtitle:"Ready to see how many disasters you'll cause today? 😂",
    start:"Start Game",
    restart:"Play Again",
    placeholder:"Enter your name",
    end:"Game Over",
    dept:"🏢 Facility Management Department"
  }
};

function toggleLang(){
  lang = (lang==="ar") ? "en" : "ar";
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang==="ar") ? "rtl" : "ltr";

  document.getElementById("title").innerText=text[lang].title;
  document.getElementById("subtitle").innerText=text[lang].subtitle;
  document.getElementById("startBtn").innerText=text[lang].start;
  document.getElementById("restartBtn").innerText=text[lang].restart;
  document.getElementById("nameInput").placeholder=text[lang].placeholder;
}

// 🔀 خلط
function shuffleArray(arr){
 for(let i=arr.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}

// 🎮 سيناريوهات مطوّرة
const scenarios=[
{
q:"💧 تسريب ماء كبير في الدور الثالث!\n\nالورق يتبلل والموظفين يشتكون من صوت التنقيط.",
c:[
{label:"أبلغ الصيانة فوراً وأوثّق الحالة",type:"good",chaos:0,msg:"تصرف احترافي 👏"},
{label:"أجيب دلو وأحطه تحت التسريب",type:"fix",chaos:15,msg:"ترقيع مؤقت 😂"},
{label:"أتجاهل الموضوع وأقول يمكن ينشف",type:"bad",chaos:35,msg:"كارثة إدارية 💀"}
]
},

{
q:"⚡ رائحة احتراق من غرفة الكهرباء!\n\nالإنذار ما اشتغل لكن الوضع مريب.",
c:[
{label:"أفصل القاطع الرئيسي فوراً",type:"good",chaos:0,msg:"تصرف بطولي 🔥"},
{label:"أفتح الباب وأشوف بنفسي",type:"fix",chaos:20,msg:"شجاعة زايدة 😂"},
{label:"أرش معطر جو",type:"bad",chaos:40,msg:"وش ذا التفكير 💀"}
]
},

{
q:"🚽 انسداد مفاجئ في دورات المياه!\n\nالروائح بدأت تنتشر.",
c:[
{label:"أغلق المنطقة وأبلغ السباكة",type:"good",chaos:0,msg:"تصرف ممتاز 👌"},
{label:"أحاول أفك السدد بنفسي",type:"fix",chaos:15,msg:"محاولة شجاعة 😂"},
{label:"أحط معطر وأمشي",type:"bad",chaos:30,msg:"الوضع صار أسوأ 💀"}
]
},

{
q:"🔥 مكيف يصدر صوت طقطقة وحرارة الغرفة أرتفعت!",
c:[
{label:"أفصل المكيف فوراً",type:"good",chaos:0,msg:"حركة ذكية 👏"},
{label:"أحط مروحة قدامه و واحدة قدامي",type:"fix",chaos:10,msg:"ترقيع كلاسيكي 😂"},
{label:"أطنش وأقول يمكن يبرد",type:"bad",chaos:35,msg:"انفجار محتمل 💀"}
]
},

{
q:"📦 موظف يطلب نقل 20 كرتون ثقيلة للدور الرابع بدون مصعد!",
c:[
{label:"أطلب عمال نقل متخصصين",type:"good",chaos:0,msg:"تنظيم ممتاز 👌"},
{label:"أحاول أشيلها بنفسي",type:"fix",chaos:10,msg:"ظهرك بيودعك 😂"},
{label:"أقول له: استخدم الدرج",type:"bad",chaos:25,msg:"شكوى رسمية جاية 💀"}
]
},

{
q:"🧯 إنذار حريق اشتغل بالغلط أثناء زيارة المدير العام!",
c:[
{label:"أشرح الموقف بسرعة وأوقف الإنذار",type:"good",chaos:0,msg:"احترافية 👏"},
{label:"أقول للمدير: يمكن تدريب مفاجئ",type:"fix",chaos:10,msg:"كذبة بيضاء 😂"},
{label:"أتجاهل الإنذار",type:"bad",chaos:30,msg:"إحراج تاريخي 💀"}
]
},

// 💀 BOSS
{
boss:true,
q:"💀 FINAL BOSS\n\nانقطاع كهرباء شامل + تسريب ماء + إنذار حريق شغال!\n\nالإدارة تتصل عليك كل دقيقة.",
c:[
{label:"تنفيذ إخلاء كامل + تبليغ + تنسيق مع الأمن",type:"good",chaos:5,msg:"قريب للكمال 👏🔥"},
{label:"أحاول أوقف الماء أولاً",type:"fix",chaos:20,msg:"ترتيب أولويات غريب 😅"},
{label:"أهدّي الموظفين بدون أي إجراء",type:"bad",chaos:40,msg:"أسوأ قرار 💀"}
]
}
];

let step=0,chaos=0,name="";
let leaderboard=JSON.parse(localStorage.getItem("lb")||"[]");

function startGame(){
 name=document.getElementById("nameInput").value;
 if(!name)return alert("اكتب اسمك");

 shuffleArray(scenarios);

 show("sGame");
 load();
}

function load(){
 let s=scenarios[step];

 document.getElementById("question").innerText=s.q;

 let box=document.getElementById("choices");
 box.innerHTML="";

 shuffleArray([...s.c]).forEach(c=>{
  let b=document.createElement("button");
  b.innerText=c.label;
  b.onclick=()=>pick(c);
  box.appendChild(b);
 });
}

function pick(choice){
 chaos+=choice.chaos + Math.floor(Math.random()*6);

 document.getElementById("feedback").innerText=choice.msg;

 setTimeout(()=>{
  step++;
  if(step>=scenarios.length) end();
  else load();
 },1500);
}

function end(){
 document.getElementById("endTitle").innerText=text[lang].end;
 document.getElementById("endSub").innerHTML=
`نسبة الكوارث: ${chaos}%<br><br>${text[lang].dept}`;

 leaderboard.push({name,chaos});
 leaderboard.sort((a,b)=>a.chaos-b.chaos);
 localStorage.setItem("lb",JSON.stringify(leaderboard));

 renderLB();
 show("sEnd");
}

function renderLB(){
 let el=document.getElementById("lbContent");

 if(!leaderboard.length){
  el.innerHTML='<div class="lb-empty">لا يوجد نتائج بعد</div>';
  return;
 }

 el.innerHTML=leaderboard.map(e=>`<div>${e.name} - ${e.chaos}%</div>`).join("");
}

function resetGame(){
 step=0;chaos=0;
 show("sStart");
}

function show(id){
 ["sStart","sGame","sEnd"].forEach(s=>document.getElementById(s).classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
