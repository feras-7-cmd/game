<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يوم في حياة مهندس صيانة - مستشفى الملك سلمان التخصصي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    /* التنسيقات الكاملة والاحترافية من ملفك الأصلي */
    :root {
        --green: #00c853; --red: #ff1744; --yellow: #ffd600; --blue: #2979ff; --purple: #7b1fa2;
        --bg: #0a0e1a; --card: #131929; --card2: #1a2236; --border: #2a3a5a; --text: #e8eaf6; --muted: #8899bb;
        --shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; direction: rtl; }
    
    .wrapper { max-width: 600px; margin: 0 auto; padding: 20px; position: relative; z-index: 2; }
    
    /* شاشات اللعبة */
    .screen { display: none; opacity: 0; transform: translateY(20px); transition: all 0.5s ease; }
    .screen.active { display: block; opacity: 1; transform: translateY(0); }

    /* البطاقات */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 30px; box-shadow: var(--shadow); margin-bottom: 25px; position: relative; overflow: hidden; }
    
    /* مؤشر الفوضى الاحترافي */
    .chaos-meter { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; margin-bottom: 25px; border: 1px solid var(--border); }
    .chaos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .chaos-bar-container { height: 14px; background: #000; border-radius: 7px; overflow: hidden; position: relative; border: 1px solid #333; }
    #chaosBar { height: 100%; width: 0%; transition: width 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28); }

    /* الأزرار والتفاعل */
    .btn-main { width: 100%; padding: 20px; border-radius: 18px; border: none; background: linear-gradient(135deg, var(--blue), #1565c0); color: white; font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 6px 20px rgba(41,121,255,0.4); margin-top: 10px; }
    .btn-main:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(41,121,255,0.5); }
    .btn-main:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; transform: none; }

    .opt-btn { width: 100%; padding: 18px; margin-bottom: 15px; border-radius: 16px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; text-align: right; transition: 0.2s; position: relative; }
    .opt-btn:hover { background: var(--border); border-color: var(--blue); transform: scale(1.02); }

    /* التذييل */
    .footer-credit { text-align: center; margin-top: 30px; padding: 20px; border-top: 1px solid var(--border); color: var(--blue); font-size: 15px; font-weight: 800; background: rgba(41, 121, 255, 0.05); border-radius: 15px; letter-spacing: 0.5px; }

    /* نظام النقاط والنجوم */
    .stats-row { display: flex; gap: 15px; margin-bottom: 20px; }
    .stat-card { flex: 1; background: var(--card2); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid var(--border); }
</style>
</head>
<body>

<div class="wrapper">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
        <div id="gameLogo" style="font-weight:900; font-size:20px; color:var(--blue);">KSSH <span style="color:var(--text); font-weight:400;">| FM</span></div>
        <button class="btn-main" id="langToggle" onclick="toggleLanguage()" style="width:auto; padding:8px 15px; margin:0; font-size:14px;">English</button>
    </div>

    <div id="screenMain" class="screen active">
        <div class="card" style="text-align:center;">
            <h1 id="mainTitle" style="font-size:36px; margin-bottom:10px;">أبطال الصيانة</h1>
            <p id="mainSub" style="color:var(--muted); margin-bottom:30px;">مستشفى الملك سلمان التخصصي</p>
            <input type="text" id="userName" placeholder="أدخل اسمك يا بطل..." oninput="validateInput()" style="width:100%; padding:18px; border-radius:15px; background:#000; border:2px solid var(--border); color:#fff; margin-bottom:20px; text-align:center; font-size:18px;">
            <button id="btnStart" class="btn-main" onclick="initGame()" disabled>ابدأ المناوبة ⚡</button>
        </div>
    </div>

    <div id="screenGame" class="screen">
        <div class="chaos-meter">
            <div class="chaos-header">
                <span id="labelChaos" style="font-weight:800;">مؤشر الفوضى</span>
                <span id="chaosVal" style="font-weight:900; color:var(--green);">0%</span>
            </div>
            <div class="chaos-bar-container"><div id="chaosBar"></div></div>
        </div>

        <div class="card">
            <div id="scNo" style="background:var(--blue); display:inline-block; padding:5px 15px; border-radius:10px; font-size:12px; font-weight:800; margin-bottom:15px;"></div>
            <h2 id="scDesc" style="font-size:20px; line-height:1.6; margin-bottom:25px;"></h2>
            <div id="optionsContainer"></div>
        </div>
    </div>

    <div id="screenEnd" class="screen">
        <div class="card" style="text-align:center;">
            <h1 id="endTitle">المناوبة انتهت!</h1>
            <div id="scoreDisplay" style="font-size:60px; font-weight:900; color:var(--green); margin:20px 0;">0</div>
            <p id="endMsg" style="margin-bottom:30px; color:var(--muted);"></p>
            <button class="btn-main" onclick="location.reload()">إعادة المهمة 🔄</button>
        </div>
    </div>

    <div class="footer-credit" id="footerArea">
        قسم إدارة المرافق - برعاية أ. فراس يماني
    </div>
</div>

<script>
    const CONFIG = {
        ar: {
            title: "أبطال الصيانة", sub: "مستشفى الملك سلمان التخصصي",
            start: "ابدأ المناوبة ⚡", chaos: "مؤشر الفوضى", end: "المناوبة انتهت!",
            footer: "قسم إدارة المرافق - برعاية أ. فراس يماني",
            scenarios: [
                {id:1, text:"الجو أصبح بارداً جداً في أجنحة التنويم، وبدأ المرضى بالانزعاج.", opts:[
                    {t:"رفع تيكت في موقع الصيانة الداخلي فوراً", c:10, s:20, r:"إجراء نظامي سليم."},
                    {t:"التوجه للوحة التحكم وضبط الحرارة يدوياً", c:-15, s:40, r:"استجابة سريعة! المرضى يشكرونك."}
                ]},
                {id:2, text:"بلاغ طارئ: انقطاع الكهرباء عن مستودع الأدوية والمولد لم يعمل!", opts:[
                    {t:"تشغيل المولد يدوياً (Manual Mode)", c:-20, s:50, r:"بطل! أنقذت مخزون الأدوية."},
                    {t:"إبلاغ قسم الصيانة وانتظار وصول المهندس المختص", c:40, s:10, r:"تأخير كبير قد يؤدي لتلف الأدوية."}
                ]},
                {id:3, text:"تعطل مصعد الطوارئ وبداخله فريق Code Blue وحالة حرجة.", opts:[
                    {t:"استخدام مفتاح الطوارئ لفتح الأبواب يدوياً", c:-30, s:60, r:"أنقذت حياة إنسان! عمل بطولي."},
                    {t:"الاتصال بشركة المصاعد والانتظار في الموقع", c:60, s:-20, r:"كارثة! الوقت في المستشفى يعني حياة."}
                ]},
                {id:4, text:"تسريب مياه قوي في الممر الرئيسي المؤدي لغرف العمليات.", opts:[
                    {t:"إغلاق المحبس الرئيسي وعزل المنطقة", c:-10, s:30, r:"سيطرة ممتازة على الموقف."},
                    {t:"وضع لوحة 'أرضية زلقة' والبحث عن مصدر التسريب", c:30, s:10, r:"المياه انتشرت أكثر، كان يجب العزل أولاً."}
                ]}
            ]
        },
        en: {
            title: "Maintenance Heroes", sub: "King Salman Specialist Hospital",
            start: "Start Shift ⚡", chaos: "Chaos Meter", end: "Shift Ended!",
            footer: "Facilities Management Dept - Sponsored by Mr. Firas Yamani",
            scenarios: [
                {id:1, text:"AC temperature dropped in wards, patients are complaining.", opts:[
                    {t:"Raise an internal maintenance ticket", c:10, s:20, r:"Correct formal procedure."},
                    {t:"Go to control panel and adjust manually", c:-15, s:40, r:"Fast response! Patients are happy now."}
                ]},
                {id:2, text:"Emergency: Power failure in pharmacy storage and generator failed!", opts:[
                    {t:"Switch generator to manual mode immediately", c:-20, s:50, r:"Hero! You saved the medicine stock."},
                    {t:"Report to maintenance and wait for specialist", c:40, s:10, r:"Too slow, medicine might spoil."}
                ]},
                {id:3, text:"Emergency elevator stuck with a Code Blue team inside.", opts:[
                    {t:"Use emergency key to open doors manually", c:-30, s:60, r:"You saved a life! Heroic action."},
                    {t:"Call elevator company and wait at the scene", c:60, s:-20, r:"Disaster! Every second counts in a hospital."}
                ]}
            ]
        }
    };

    let state = { lang: 'ar', score: 0, chaos: 0, current: 0, scenarios: [] };

    function toggleLanguage() {
        state.lang = state.lang === 'ar' ? 'en' : 'ar';
        document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('langToggle').textContent = state.lang === 'ar' ? 'English' : 'العربية';
        updateStaticTexts();
        if(state.scenarios.length > 0) {
            state.scenarios = CONFIG[state.lang].scenarios;
            renderScenario();
        }
    }

    function updateStaticTexts() {
        const d = CONFIG[state.lang];
        document.getElementById('mainTitle').textContent = d.title;
        document.getElementById('mainSub').textContent = d.sub;
        document.getElementById('btnStart').textContent = d.start;
        document.getElementById('labelChaos').textContent = d.chaos;
        document.getElementById('endTitle').textContent = d.end;
        document.getElementById('footerArea').textContent = d.footer;
    }

    function validateInput() {
        const val = document.getElementById('userName').value;
        document.getElementById('btnStart').disabled = val.trim().length < 2;
    }

    function initGame() {
        state.scenarios = CONFIG[state.lang].scenarios;
        switchScreen('screenGame');
        renderScenario();
    }

    function renderScenario() {
        const sc = state.scenarios[state.current];
        document.getElementById('scNo').textContent = (state.lang === 'ar' ? 'مهمة رقم ' : 'Mission #') + (state.current + 1);
        document.getElementById('scDesc').textContent = sc.text;
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        sc.opts.forEach(o => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.textContent = o.t;
            b.onclick = () => handleChoice(o);
            container.appendChild(b);
        });
    }

    function handleChoice(o) {
        state.chaos = Math.max(0, Math.min(100, state.chaos + o.c));
        state.score += o.s;
        updateChaosUI();
        alert(o.r);
        state.current++;
        if(state.current < state.scenarios.length) renderScenario();
        else finish();
    }

    function updateChaosUI() {
        const bar = document.getElementById('chaosBar');
        const val = document.getElementById('chaosVal');
        bar.style.width = state.chaos + '%';
        val.textContent = state.chaos + '%';
        const col = state.chaos < 35 ? 'var(--green)' : state.chaos < 70 ? 'var(--yellow)' : 'var(--red)';
        bar.style.background = col;
        val.style.color = col;
    }

    function finish() {
        switchScreen('screenEnd');
        document.getElementById('scoreDisplay').textContent = state.score;
        document.getElementById('endMsg').textContent = state.lang === 'ar' ? 'شكراً لجهودك في حماية المستشفى!' : 'Thank you for protecting the hospital!';
    }

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
