<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يوم في حياة قسم الصيانة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --card: #111827;
    --card2: #1f2937;
    --border: #374151;
    --text: #f9fafb;
    --muted: #9ca3af;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    direction: rtl;
  }
  h1.game-title {
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 16px;
    max-width: 980px;
    margin: 0 auto;
  }
  @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
  }

  /* NAME SCREEN */
  .name-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .big-icon { font-size: 58px; }
  .name-screen h2 { font-size: 20px; font-weight: 700; }
  .name-screen p { color: var(--muted); font-size: 14px; }
  .name-input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--card2);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 16px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  .name-input:focus { border-color: #60a5fa; }
  .btn-start {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    font-family: 'Cairo', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .btn-start:hover { transform: scale(1.02); }
  .btn-start:active { transform: scale(0.97); }

  /* CHAOS METER */
  .chaos-block { margin-bottom: 18px; }
  .chaos-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
  }
  .chaos-label { color: var(--muted); }
  .chaos-value { font-size: 14px; font-weight: 700; transition: color 0.4s; }
  .meter-track {
    height: 14px;
    background: #1f2937;
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1), background 0.4s;
  }

  /* STEPS */
  .steps-row {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    justify-content: center;
  }
  .step-dot {
    width: 28px;
    height: 6px;
    border-radius: 99px;
    background: var(--border);
    transition: background 0.3s;
  }
  .step-dot.done { background: #16a34a; }
  .step-dot.active { background: #60a5fa; }

  /* SCENARIO */
  .scenario-box {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #question {
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    line-height: 1.7;
  }

  /* CHOICES */
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    padding: 13px 18px;
    border-radius: 12px;
    border: 1.5px solid transparent;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
    text-align: right;
    color: white;
  }
  .choice-btn:hover { transform: translateX(-5px); filter: brightness(1.12); }
  .choice-btn:active { transform: scale(0.97); }
  .choice-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .choice-btn.good, .choice-btn.fix, .choice-btn.bad {
    background: var(--card2);
    border-color: var(--border);
    color: var(--text);
  }
  .choice-btn.revealed-good { background: #14532d !important; border-color: #16a34a !important; }
  .choice-btn.revealed-fix  { background: #78350f !important; border-color: #d97706 !important; }
  .choice-btn.revealed-bad  { background: #7f1d1d !important; border-color: #dc2626 !important; }

  /* FEEDBACK */
  .feedback {
    text-align: center;
    min-height: 52px;
    margin-top: 12px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s, transform 0.3s;
  }
  .feedback.show { opacity: 1; transform: translateY(0); }

  /* END SCREEN */
  .end-screen {
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 8px 0;
    animation: popIn 0.4s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .end-icon-big { font-size: 64px; }
  .end-title { font-size: 26px; font-weight: 900; text-align: center; }
  .end-badge {
    padding: 10px 28px;
    border-radius: 99px;
    font-size: 16px;
    font-weight: 700;
  }
  .end-sub { color: var(--muted); font-size: 14px; text-align: center; }
  .chaos-final { font-size: 14px; color: var(--muted); }
  .chaos-final span { font-weight: 700; }
  .btn-again {
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-again:hover { background: #374151; }

  /* LEADERBOARD */
  .lb-header {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .lb-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  .lb-list { display: flex; flex-direction: column; gap: 8px; }
  .lb-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--card2);
    border-radius: 12px;
    border: 1px solid var(--border);
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { transform: translateX(10px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .lb-rank { font-size: 16px; font-weight: 900; min-width: 24px; text-align: center; }
  .lb-info { flex: 1; min-width: 0; }
  .lb-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-badge-sm { font-size: 11px; padding: 2px 8px; border-radius: 99px; margin-top: 3px; display: inline-block; font-weight: 600; }
  .lb-chaos-val { font-size: 13px; font-weight: 700; min-width: 32px; text-align: left; }

  .lb-clear-btn {
    width: 100%;
    margin-top: 12px;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .lb-clear-btn:hover { color: #f87171; }

  /* SHAKE */
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .shake { animation: shake 0.4s ease; }

  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; }
</style>
</head>
<body>

<h1 class="game-title">🔧 يوم في حياة قسم الصيانة</h1>
<p class="subtitle">كذب ولا صدق؟ كم كارثة راح تسوّيها اليوم؟ 😂</p>

<div class="layout">

  <div class="panel" id="gamePanel">

    <!-- NAME SCREEN -->
    <div id="sName" class="screen active">
      <div class="name-screen">
        <div class="big-icon">🛠️</div>
        <h2>وش اسمك يا فني؟ 👷</h2>
        <p>حط اسمك عشان نسجلك في لوحة المهندسين اللي خربوا الدنيا 😂</p>
        <input id="nameInput" class="name-input" type="text" placeholder="اكتب اسمك هنا..." maxlength="20" />
        <button class="btn-start" onclick="startGame()">يلا نبدأ ▶</button>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="sGame" class="screen">
      <div class="chaos-block">
        <div class="chaos-header">
          <span class="chaos-label">⚠️ مؤشر الكوارث</span>
          <span class="chaos-value" id="chaosVal">0%</span>
        </div>
        <div class="meter-track">
          <div class="meter-fill" id="meterFill"></div>
        </div>
      </div>
      <div class="steps-row" id="stepsRow"></div>
      <div class="scenario-box">
        <p id="question"></p>
      </div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <!-- END SCREEN -->
    <div id="sEnd" class="screen end-screen">
      <div class="end-icon-big" id="endIcon">🏁</div>
      <div class="end-title" id="endTitle"></div>
      <div class="end-badge" id="endBadge"></div>
      <div class="chaos-final">مؤشر الكوارث: <span id="endChaos"></span>%</div>
      <div class="end-sub" id="endSub"></div>
      <button class="btn-again" onclick="resetGame()">🔄 جولة ثانية؟ يلا!</button>
    </div>

  </div>

  <!-- LEADERBOARD -->
  <div class="panel" style="height:fit-content;">
    <div class="lb-header">🏆 لوحة المهندسين</div>
    <div id="lbContent"></div>
  </div>

</div>

<script>
const scenarios = [ {
    q: "💧 المكيف قرر يتحول لشلال ويصب موية على ملفات المرضى!",
    c: [
      { label: "أحط سطل وأرفع تيكت فوراً", type: "good", msg: "كفو 👏 وفرت علينا غرق الملفات!", chaos: 0 },
      { label: "أسدها بلصق جروح", type: "fix", msg: "ههههه هذا مكيف مو جرح 😂", chaos: 15 },
      { label: "أهز الأسلاك بيدي وهي مبلولة", type: "bad", msg: "تبغى تصير فلاش؟ ⚡💀", chaos: 35 }
    ]
  },
  {
    q: "⚡ فيش يشرر وريحة بلاستيك محروق!",
    c: [
      { label: "أفصل القاطع وأبلغ الصيانة", type: "good", msg: "بطل 🔥 أنقذت المكان", chaos: 0 },
      { label: "أوجه عليه مروحة", type: "fix", msg: "ههههه مو حار عشان يبرد 😂", chaos: 15 },
      { label: "أدخل ملعقة حديد", type: "bad", msg: "تذكرة VIP للطوارئ 💀", chaos: 35 }
    ]
  },
  {
    q: "🚪 باب يصرصر بشكل مزعج!",
    c: [
      { label: "أرفع تيكت صيانة", type: "good", msg: "تصرف احترافي 👌", chaos: 0 },
      { label: "أحط معقم على المفصلات", type: "fix", msg: "ريحة ليمون + مشكلة جديدة 😂", chaos: 10 },
      { label: "أشيل الباب كامل", type: "bad", msg: "خدمة ذاتية؟ 😂💀", chaos: 30 }
    ]
  },
  {
    q: "🚰 الحنفية انفجرت وتضخ موية!",
    c: [
      { label: "أقفل المحبس", type: "good", msg: "ذيب 👏 أنقذت الوضع", chaos: 0 },
      { label: "ألف شاش عليها", type: "fix", msg: "ربطة طبية للسباكة؟ 😂", chaos: 15 },
      { label: "أسدها بإبهامي", type: "bad", msg: "بتجلس لين المناوبة الجاية؟ 😂💀", chaos: 35 }
    ]
  },
  {
    q: "🌧️ سقف ينقط موية غريبة!",
    c: [
      { label: "أحط تحذير وأبلغ", type: "good", msg: "السلامة أولاً 👌", chaos: 0 },
      { label: "ألصق كيس نفايات", type: "fix", msg: "سويت مظلة 😂", chaos: 15 },
      { label: "أشيل البلاطة فوق راسي", type: "bad", msg: "شاور مفاجئ 💀", chaos: 35 }
    ]
  },
  {
    q: "💡 لمبة تسوي ديسكو!",
    c: [
      { label: "أطفيها وأبلغ", type: "good", msg: "قرار حكيم 👌", chaos: 0 },
      { label: "أغطيها بأشعة", type: "fix", msg: "حولتها سينما 😂", chaos: 10 },
      { label: "أهزها وهي تشرر", type: "bad", msg: "إعادة ضبط كهربائي 💀", chaos: 30 }
    ]
  },
  {
    q: "🛏️ سرير مريض علق!",
    c: [
      { label: "أفصل الكهرباء وأساعد المريض", type: "good", msg: "أنقذت الموقف 👏", chaos: 0 },
      { label: "أحط مخدات", type: "fix", msg: "زحليقة ناعمة 😂", chaos: 15 },
      { label: "ألمس الأسلاك", type: "bad", msg: "بتصير دينامو 💀", chaos: 35 }
    ]
  },
  {
    q: "🛗 مصعد علق!",
    c: [
      { label: "أبلغ وأهدّي المريض", type: "good", msg: "بطل 👌", chaos: 0 },
      { label: "أستخدم جزمة لفتح الباب", type: "fix", msg: "ضحيت بالجزمة 😂", chaos: 15 },
      { label: "أتسلق السقف", type: "bad", msg: "مهمة مستحيلة 💀", chaos: 35 }
    ]
  },
  {
    q: "❄️ العيادة صارت فريزر!",
    c: [
      { label: "أطفي المكيف وأبلغ", type: "good", msg: "تصرف منطقي 👌", chaos: 0 },
      { label: "أستخدم استشوار", type: "fix", msg: "صالون تجميل؟ 😂", chaos: 15 },
      { label: "أفتح الشباك بالظهر", type: "bad", msg: "صدمة حرارية 💀", chaos: 35 }
    ]
  },
  {
    q: "🚀 أنبوبة أكسجين صارت صاروخ!",
    c: [
      { label: "إخلاء + تبليغ", type: "good", msg: "احترافي 🔥", chaos: 0 },
      { label: "أمسكها بيدي", type: "fix", msg: "روديو 😂", chaos: 20 },
      { label: "أوجهها للمدير", type: "bad", msg: "استقالة فورية 💀", chaos: 40 }
    ]
  }
];


const TITLES = [
  { max: 0,   icon: "🌟", label: "المهندس الأسطورة",  color: "#c4b5fd", bg: "#2e1065" },
  { max: 20,  icon: "😎", label: "المهندس المتخفي",    color: "#93c5fd", bg: "#1e3a5f" },
  { max: 50,  icon: "🤔", label: "فني بالصدفة",         color: "#fcd34d", bg: "#451a03" },
  { max: 75,  icon: "🤡", label: "زعيم الترقيع",        color: "#fdba74", bg: "#431407" },
  { max: 101, icon: "💀", label: "بطل الكوارث",          color: "#fca5a5", bg: "#450a0a" }
];

function getTitle(c) {
  return TITLES.find(t => c <= t.max) || TITLES[TITLES.length - 1];
}

function chaosColor(c) {
  if (c <= 20) return "#4ade80";
  if (c <= 50) return "#fbbf24";
  if (c <= 75) return "#fb923c";
  return "#f87171";
}

let playerName = "", step = 0, chaos = 0;
let leaderboard = [];
try { leaderboard = JSON.parse(localStorage.getItem("mtnLB2") || "[]"); } catch(e) {}

document.getElementById("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });

function showScreen(id) {
  ["sName","sGame","sEnd"].forEach(s => {
    const el = document.getElementById(s);
    el.classList.remove("active");
    el.style.display = "none";
  });
  const t = document.getElementById(id);
  t.style.display = "flex";
  t.classList.add("active");
}

function startGame() {
  const v = document.getElementById("nameInput").value.trim();
  if (!v) {
    const inp = document.getElementById("nameInput");
    inp.style.borderColor = "#dc2626";
    inp.placeholder = "ما تقدر تكمل بدون اسم يا فني! 😅";
    return;
  }
  playerName = v;
  step = 0; chaos = 0;
  showScreen("sGame");
  loadStep();
}

function loadStep() {
  const s = scenarios[step];
  const qEl = document.getElementById("question");
  qEl.innerHTML = s.q.replace(/\n/g, "<br>");
  const fb = document.getElementById("feedback");
  fb.classList.remove("show");
  fb.textContent = "";

  const row = document.getElementById("stepsRow");
  row.innerHTML = "";
  scenarios.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "step-dot" + (i < step ? " done" : i === step ? " active" : "");
    row.appendChild(d);
  });

  const box = document.getElementById("choices");
  box.innerHTML = "";
  s.c.forEach(c => {
    const b = document.createElement("button");
    b.className = "choice-btn " + c.type;
    b.dataset.type = c.type;
    b.textContent = c.label;
    b.onclick = () => pick(c);
    box.appendChild(b);
  });

  updateMeter();
}

function pick(choice) {
  const allBtns = document.querySelectorAll(".choice-btn");
  allBtns.forEach(b => {
    b.disabled = true;
    b.classList.add("revealed-" + b.dataset.type);
  });
  chaos = Math.min(100, chaos + choice.chaos);

  const fb = document.getElementById("feedback");
  fb.textContent = choice.msg;
  fb.style.color = choice.type === "good" ? "#4ade80" : choice.type === "fix" ? "#fbbf24" : "#f87171";
  fb.classList.add("show");

  if (choice.type === "bad") {
    document.getElementById("gamePanel").classList.add("shake");
    setTimeout(() => document.getElementById("gamePanel").classList.remove("shake"), 400);
  }

  updateMeter();

  if (chaos >= 100) { setTimeout(() => endGame(true), 2500); return; }

  setTimeout(() => {
    step++;
    if (step >= scenarios.length) endGame(false);
    else loadStep();
  }, 2500);
}

function updateMeter() {
  const col = chaosColor(chaos);
  document.getElementById("meterFill").style.width = chaos + "%";
  document.getElementById("meterFill").style.background = col;
  document.getElementById("chaosVal").style.color = col;
  document.getElementById("chaosVal").textContent = chaos + "%";
}

function endGame(crashed) {
  const t = getTitle(chaos);
  document.getElementById("endIcon").textContent = t.icon;
  document.getElementById("endTitle").textContent = crashed ? "💥 يا حليلك! كارثة كاملة!" : "🏁 خلصت الجولة!";
  const badge = document.getElementById("endBadge");
  badge.textContent = t.label;
  badge.style.background = t.bg;
  badge.style.color = t.color;
  document.getElementById("endChaos").textContent = chaos;
  document.getElementById("endChaos").style.color = chaosColor(chaos);
  document.getElementById("endSub").textContent =
    chaos === 0 ? "ما سويت ولا كارثة وحدة! وش إنت مهندس ولا ملاك؟ 🤩" :
    crashed ? "وصلت للحد الأقصى من الكوارث الممكنة، تهانينا 😂" :
    `سويت ${chaos}% من الكوارث الممكنة، مو بطال 😅`;

  saveToLB(playerName, chaos, t.label, t.color, t.bg);
  showScreen("sEnd");
}

function saveToLB(name, c, title, color, bg) {
  leaderboard.push({ name, chaos: c, title, color, bg });
  leaderboard.sort((a, b) => a.chaos - b.chaos);
  if (leaderboard.length > 10) leaderboard.length = 10;
  try { localStorage.setItem("mtnLB2", JSON.stringify(leaderboard)); } catch(e) {}
  renderLB();
}

function renderLB() {
  const el = document.getElementById("lbContent");
  if (!leaderboard.length) {
    el.innerHTML = '<div class="lb-empty">لا أحد لعب بعد 😴<br>كن أول مهندس كارثة!</div>';
    return;
  }
  const medals = ["🥇","🥈","🥉"];
  el.innerHTML = '<div class="lb-list">' + leaderboard.map((e, i) =>
    `<div class="lb-item">
      <div class="lb-rank">${medals[i] || (i+1)}</div>
      <div class="lb-info">
        <div class="lb-name">${esc(e.name)}</div>
        <span class="lb-badge-sm" style="background:${e.bg};color:${e.color}">${esc(e.title)}</span>
      </div>
      <div class="lb-chaos-val" style="color:${chaosColor(e.chaos)}">${e.chaos}%</div>
    </div>`
  ).join("") + '</div>';
}

function clearLB() {
  if (!confirm("تمسح كل السجلات؟")) return;
  leaderboard = [];
  try { localStorage.removeItem("mtnLB2"); } catch(e) {}
  renderLB();
}

function resetGame() {
  step = 0; chaos = 0;
  const inp = document.getElementById("nameInput");
  inp.value = "";
  inp.style.borderColor = "";
  inp.placeholder = "اكتب اسمك هنا...";
  showScreen("sName");
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

renderLB();
</script>
