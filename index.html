<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🎮 يوم في حياة فني صيانة</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#020617);
  color: white;
  text-align: center;
  padding: 20px;
}

#card {
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  max-width:500px;
  margin:auto;
}

button {
  display:block;
  margin:10px auto;
  padding:14px;
  width:90%;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}

.good{background:#22c55e;}
.fix{background:#f59e0b;}
.bad{background:#ef4444;}

#msg {
  margin-top:15px;
  min-height:40px;
}

.progress {
  height:10px;
  background:#111;
  border-radius:10px;
  margin-bottom:15px;
}

.bar {
  height:10px;
  background:#ef4444;
  width:0%;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>🎮 يوم في حياة فني صيانة 😂🔧</h2>

<div class="progress"><div id="bar" class="bar"></div></div>

<div id="card">
<p id="q"></p>
<div id="choices"></div>
<p id="msg"></p>
</div>

<script>

let step = 0;
let chaos = 0;

const scenarios = [

{
q:"💧 المكيف يصب موية على الملفات!",
c:[
["بلغ الصيانة","good","كفو! 😎"],
["شاش طبي","fix","ترقيع 😂"],
["فك المكيف","bad","يا ساتر 💀"]
]
},

{
q:"⚡ فيش يطلع شرار!",
c:[
["افصل الكهرباء","good","تصرف سليم 👌"],
["اضربه","fix","يمكن يشتغل 🤡"],
["امسكه","bad","نبيك تعيش 💀"]
]
},

{
q:"🚰 حنفية انفجرت!",
c:[
["قفل المحبس","good","بطل 👏"],
["لاصق","fix","ترقيع 😂"],
["تتركها","bad","غرق 💀"]
]
},

{
q:"💡 لمبة ديسكو!",
c:[
["بلغ","good","صح 👍"],
["طنش","fix","حفلة 😂"],
["تفكها","bad","آخر مرة 💀"]
]
},

{
q:"🚪 باب يصرصر!",
c:[
["بلغ","good","قرار حكيم 👏"],
["معقم","fix","ابتكار 😂"],
["تركله","bad","عدواني 💀"]
]
}

];

function load(){
let s = scenarios[step];
document.getElementById("q").innerText = s.q;

let html = "";
s.c.forEach(x=>{
html += <button class="${x[1]}" onclick="choose('${x[1]}','${x[2]}')">${x[0]}</button>;
});

document.getElementById("choices").innerHTML = html;
document.getElementById("msg").innerText = "";
updateBar();
}

function choose(type,msg){

if(type==="bad") chaos+=30;
else if(type==="fix") chaos+=15;

document.getElementById("msg").innerText = msg;

setTimeout(next,700);
}

function next(){
step++;

if(chaos>=100){
end("🚑 تم استدعاء الفني قبل ما تصير كارثة!","💀 بطل الكوارث");
return;
}

if(step>=scenarios.length){
let title="🤡 زعيم الترقيع";
if(chaos<40) title="😎 المهندس المتخفي";
end("🏁 خلصت الجولة!",title);
return;
}

load();
}

function updateBar(){
document.getElementById("bar").style.width = chaos + "%";
}

function end(msg,title){
document.getElementById("card").innerHTML =
<h3>${msg}</h3><h2>${title}</h2><p>😂 شاركها مع زملائك!</p>;
}

load();

</script>

</body>
</html>
